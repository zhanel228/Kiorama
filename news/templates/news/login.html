{% extends 'news/base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-form-container">
        <h2>🌙 Вход в систему</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Войти</button>
        </form>
        <p>Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
    </div>
</div>
{% endblock %}
